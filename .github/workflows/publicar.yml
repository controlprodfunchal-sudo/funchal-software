name: Publicar o canal

# Sempre que um HTML novo entra neste repositorio, este robo le a versao de
# dentro do proprio arquivo e reescreve os dois versao.json sozinho.
# Assim ninguem mais precisa editar JSON a mao, e some a classe de erro em que
# o HTML e o JSON discordam da versao (o celular avisa novidade que nao existe,
# ou fica quieto quando existe).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'sistema.html'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicacao-funchal
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar os arquivos
        uses: actions/checkout@v4

      - name: Ler as versoes de dentro dos HTML
        id: ler
        run: |
          TELA=''
          SIS=''
          [ -f index.html ]   && TELA=$(grep -o "APP_VERSION = '[^']*'"    index.html   | head -1 | sed "s/.*'\(.*\)'/\1/")
          [ -f sistema.html ] && SIS=$(grep -o "SYSTEM_VERSION = '[^']*'"  sistema.html | head -1 | sed "s/.*'\(.*\)'/\1/")
          echo "tela=$TELA"     >> "$GITHUB_OUTPUT"
          echo "sistema=$SIS"   >> "$GITHUB_OUTPUT"
          echo "App:     ${TELA:-(sem index.html)}"
          echo "Sistema: ${SIS:-(sem sistema.html)}"

      - name: Reescrever os dois versao.json
        env:
          TELA: ${{ steps.ler.outputs.tela }}
          SIS:  ${{ steps.ler.outputs.sistema }}
        run: |
          AGORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTAS=$(git log -1 --pretty=%s | tr -d '"' | cut -c1-160)

          # --- app do celular: mantem as linhas do APK que ja estavam la ---
          if [ -n "$TELA" ]; then
            CODIGO=$(grep -o '"apkVersionCode": *[0-9]*' versao.json 2>/dev/null | grep -o '[0-9]*' || true)
            NOMEAPK=$(grep -o '"apkVersionName": *"[^"]*"' versao.json 2>/dev/null | sed 's/.*"\(.*\)"/\1/' || true)
            URLAPK=$(grep -o '"apkUrl": *"[^"]*"' versao.json 2>/dev/null | sed 's/.*: *"\(.*\)"/\1/' || true)
            {
              echo '{'
              echo "  \"appVersion\": \"$TELA\","
              [ -n "$CODIGO" ]  && echo "  \"apkVersionCode\": $CODIGO,"
              [ -n "$NOMEAPK" ] && echo "  \"apkVersionName\": \"$NOMEAPK\","
              [ -n "$URLAPK" ]  && echo "  \"apkUrl\": \"$URLAPK\","
              echo "  \"publicadoEm\": \"$AGORA\","
              echo "  \"notas\": \"$NOTAS\""
              echo '}'
            } > versao.json
            echo '--- versao.json ---'; cat versao.json
          fi

          # --- sistema do escritorio: mantem exeVersion, exeUrl, cascaVersao... ---
          if [ -n "$SIS" ]; then
            SIS="$SIS" AGORA="$AGORA" NOTAS="$NOTAS" python3 - <<'PY'
          import json, os
          try:
              v = json.load(open('versao-sistema.json', encoding='utf8'))
          except Exception:
              v = {}
          v['systemVersion'] = os.environ['SIS']
          v['publicadoEm'] = os.environ['AGORA']
          v['notas'] = os.environ['NOTAS']
          json.dump(v, open('versao-sistema.json', 'w', encoding='utf8'), indent=2, ensure_ascii=False)
          PY
            echo '--- versao-sistema.json ---'; cat versao-sistema.json
          fi

      - name: Guardar se algo mudou
        run: |
          git config user.name  'Publicador FUNCHAL'
          git config user.email 'actions@github.com'
          for f in versao.json versao-sistema.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo 'Nada a atualizar: os versao.json ja batiam com os HTML.'
          else
            git commit -m 'Versoes atualizadas automaticamente a partir dos HTML'
            git push
            echo 'versao.json e versao-sistema.json atualizados.'
          fi
